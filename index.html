<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../styles/stylesheet.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/7597abeeff.js" crossorigin="anonymous"></script>
</head>
<body class="sb-expanded">
  <aside class="side-bar">
    <nav class="side-bar__nav">
      <ul class="side-bar__btn-list">
        <li class="side-bar__btn" id="change-color-btn"><i class="fa-solid fa-hand-point-up"></i><span>Первая карточка</span></li>
        <li class="side-bar__btn" id="change-allcards-color-btn"><i class="fa-solid fa-border-all"></i><span>Все карточки</span></li>
        <li class="side-bar__btn" id="google-homepage"><i class="fa-solid fa-square-arrow-up-right"></i><span>Дом. страница Google</span></li>
        <li class="side-bar__btn" id="console-log"><i class="fa-solid fa-terminal"></i><span>Console log</span></li>
        <li class="side-bar__btn" id="theme-toggle"><i class="fa-solid fa-circle-half-stroke"></i><span>Тёмная тема</span></li>
      </ul>
      <button type="button" data-resize-btn class="active side-bar__btn">
        <i class="fa-solid fa-chevron-down"></i>
        <span>Collapse</span>
      </button>
    </nav>
  </aside>
  <div class="catalog">
    <h1 class="catalog__title">Выбери свой продукт</h1>
    <div class="catalog__bg"></div>
    <template id="product-card-template">
      <li class="product-card">
        <img src="" alt="" class="product-card__image"> 
        <span class="product-card__pre-title"></span>
        <h2 class="product-card__title"></h2>
        <p class="product-card__description"></p>
        <div class="product-card__composition">
          <span>Состав:</span>
          <ul class="product-card__composition-list">
            <li></li>
          </ul>
        </div>
        <div class="product-card__price">
          <span class="product-card__price-label">Цена:</span>
          <span class="product-card__price-value"></span>
        </div>
        <div class="product-card__btn-wrapper">
          <button class="product-card__btn" type="button">
            <img src="images/add_icon.png" class="product-card__btn-icon" alt="">
            Купить
          </button>
        </div>
      </li>
    </template>
    <ul class="catalog__product-list"></ul>
  </div>
  <script src="script.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script src="comments.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>
</html>
